<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NECROVANTA:3030</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="scanlines"></div>

    <!-- In-game HUD -->
    <div id="hud" class="hidden">
      <div id="hud-left" class="hud-panel">
        <div class="hp-row">
          <img id="hp-icon" alt="">
          <div class="hp-bar"><div id="hp-ghost"></div><div id="hp-fill"></div><div class="hp-seg"></div><span id="hp-text">100 / 100</span></div>
        </div>
        <div id="status"></div>
        <div id="resources"></div>
      </div>
      <div id="hud-center">
        <div id="wave-label">WAVE 0 / 100</div>
        <div class="wave-bar"><div id="wave-fill"></div></div>
        <div id="wave-sub"></div>
      </div>
      <div id="hud-right">
        <div class="minimap-frame"><canvas id="minimap"></canvas></div>
        <div id="zone-line"></div>
        <div id="score-line" class="hud-panel"></div>
      </div>
      <div id="boss-bar" class="hidden"><div class="bb-name">OMEGA TITAN</div><div class="bb-track"><div id="boss-ghost"></div><div id="boss-fill"></div></div></div>
      <div id="banner"></div>
      <div id="hint"></div>
      <div id="toasts"></div>
      <div id="bottom">
        <div id="build-bar" class="hidden"></div>
        <div id="weapon-name"></div>
        <div class="hotbar-row"><div id="hotbar"></div><div id="bag-count"></div></div>
        <div id="keys-line">E OPEN/GATHER &middot; R RELOAD &middot; RMB ABILITY &middot; Q HEAL &middot; B BUILD &middot; I BAG &middot; C CRAFT &middot; U FORGE &middot; K MUSIC &middot; P PAUSE</div>
      </div>
    </div>

    <!-- Menu panel -->
    <div id="menu" class="hidden">
      <div class="panel">
        <div class="tabs">
          <button data-tab="bag">BAG</button>
          <button data-tab="supplies">SUPPLIES</button>
          <button data-tab="craft">CRAFT</button>
          <button data-tab="forge">FORGE</button>
          <button data-tab="mods">MODS</button>
          <button data-tab="survivor">SURVIVOR</button>
          <button class="close" data-close>X</button>
        </div>
        <div id="menu-body"></div>
        <div class="menu-foot">ESC TO CLOSE &middot; I / C / U / O SWITCH TABS &middot; GAME IS PAUSED</div>
      </div>
    </div>

    <!-- Full screens: title, pause, game over, victory -->
    <div id="screen" class="hidden"></div>
  </div>

  <!-- Load order matters: config first, main last -->
  <script src="js/config.js" onerror="(window.__missing = window.__missing || []).push('js/config.js')"></script>
  <script src="js/util.js" onerror="(window.__missing = window.__missing || []).push('js/util.js')"></script>
  <script src="js/audio.js" onerror="(window.__missing = window.__missing || []).push('js/audio.js')"></script>
  <script src="js/input.js" onerror="(window.__missing = window.__missing || []).push('js/input.js')"></script>
  <script src="js/sprites.js" onerror="(window.__missing = window.__missing || []).push('js/sprites.js')"></script>
  <script src="js/map.js" onerror="(window.__missing = window.__missing || []).push('js/map.js')"></script>
  <script src="js/effects.js" onerror="(window.__missing = window.__missing || []).push('js/effects.js')"></script>
  <script src="js/classes.js" onerror="(window.__missing = window.__missing || []).push('js/classes.js')"></script>
  <script src="js/player.js" onerror="(window.__missing = window.__missing || []).push('js/player.js')"></script>
  <script src="js/weapons.js" onerror="(window.__missing = window.__missing || []).push('js/weapons.js')"></script>
  <script src="js/zombies.js" onerror="(window.__missing = window.__missing || []).push('js/zombies.js')"></script>
  <script src="js/structures.js" onerror="(window.__missing = window.__missing || []).push('js/structures.js')"></script>
  <script src="js/loot.js" onerror="(window.__missing = window.__missing || []).push('js/loot.js')"></script>
  <script src="js/waves.js" onerror="(window.__missing = window.__missing || []).push('js/waves.js')"></script>
  <script src="js/bosses.js" onerror="(window.__missing = window.__missing || []).push('js/bosses.js')"></script>
  <script src="js/save.js" onerror="(window.__missing = window.__missing || []).push('js/save.js')"></script>
  <script src="js/net.js" onerror="(window.__missing = window.__missing || []).push('js/net.js')"></script>
  <script src="js/ui.js" onerror="(window.__missing = window.__missing || []).push('js/ui.js')"></script>
  <script src="js/render.js" onerror="(window.__missing = window.__missing || []).push('js/render.js')"></script>
  <script src="js/main.js" onerror="(window.__missing = window.__missing || []).push('js/main.js')"></script>
  <!-- If the game code didn't load or crashed while starting, say so instead of showing a black screen. -->
  <script>
    window.addEventListener('error', function (e) { window.__firstError = window.__firstError || (e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
    window.addEventListener('load', function () {
      if (typeof Main !== 'undefined' && Main.canvas) return;   // started fine
      var missing = window.__missing || [];
      var box = document.createElement('div');
      box.style.cssText = 'position:fixed;inset:0;z-index:99;background:#07070d;color:#e8e8f0;font:16px/1.6 monospace;padding:40px;overflow:auto';
      box.innerHTML = '<h2 style="color:#ff3d4e">NECROVANTA:3030 could not start</h2>' +
        (missing.length ? '<p>These game files are missing:</p><pre style="color:#ffd040"></pre>' +
          '<p>If you put the game online, upload the whole <b>js</b> folder (20 files) next to index.html.</p>'
          : '<p>Error: <span style="color:#ffd040"></span></p><p>Try reloading the page.</p>');
      document.body.appendChild(box);
      if (missing.length) box.querySelector('pre').textContent = missing.join('\n');
      else box.querySelector('span').textContent = window.__firstError || 'unknown';
    });
  </script>
</body>
</html>
